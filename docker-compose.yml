services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      GUARDRAILS_POLICY_PATH: /app/policies/default.yaml
      GUARDRAILS_LOG_LEVEL: INFO
      GUARDRAILS_LOG_JSON: "true"
      GUARDRAILS_LOG_PROMPTS: "false"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
